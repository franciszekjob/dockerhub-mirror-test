# Dry run of the pathfinder Docker Hub migration.
#
# Mirrors the structure of software-mansion/pathfinder .github/workflows/docker.yml:
# build and push to namespace A, then log in as namespace B and copy the image there.
#
# Two things this exercises that a single-namespace test would not:
#   1. Docker Hub allows only ONE logged-in account per registry - the second
#      docker/login-action overwrites the docker.io entry in ~/.docker/config.json.
#      Hence: push to A first, re-login as B, then copy. Never push twice.
#   2. `docker buildx imagetools create` copies the multi-arch manifest list
#      without a rebuild, so the digest in B is identical to the one in A.

name: Docker

on:
  workflow_dispatch:
    inputs:
      fake_release_tag:
        description: 'Simulate a release: also tag the snapshot as this version + latest in both namespaces (e.g. v1.2.3). Leave empty to only build a snapshot.'
        type: string
        default: ''

env:
  # NS_A is the new home (stands in for swmansion), NS_B is the legacy
  # namespace being mirrored to (stands in for eqlabs).
  NS_A: franciszekjob/mirror-test
  NS_B: fjobswm/mirror-test

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NS_A }}
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          file: ./Dockerfile
          build-args: |
            FAKE_VERSION=${{ inputs.fake_release_tag || github.sha }}
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.NS_A }}:snapshot-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Simulates the tag-release job of the real workflow.
      - name: Tag image with release name
        if: ${{ inputs.fake_release_tag != '' }}
        run: docker buildx imagetools create -t ${{ env.NS_A }}:${{ inputs.fake_release_tag }} ${{ env.NS_A }}:snapshot-${{ github.sha }}
      - name: Tag image with 'latest'
        if: ${{ inputs.fake_release_tag != '' }}
        run: docker buildx imagetools create -t ${{ env.NS_A }}:latest ${{ env.NS_A }}:snapshot-${{ github.sha }}

      # Transitional: mirror to the legacy namespace. Re-login switches the
      # docker.io credentials; reading from the (public) A repo still works.
      - name: Login to Docker Hub (legacy namespace)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LEGACY_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKER_HUB_ACCESS_TOKEN }}
      - name: Mirror snapshot to legacy namespace
        run: docker buildx imagetools create -t ${{ env.NS_B }}:snapshot-${{ github.sha }} ${{ env.NS_A }}:snapshot-${{ github.sha }}
      - name: Mirror release tag to legacy namespace
        if: ${{ inputs.fake_release_tag != '' }}
        run: docker buildx imagetools create -t ${{ env.NS_B }}:${{ inputs.fake_release_tag }} ${{ env.NS_A }}:${{ inputs.fake_release_tag }}
      - name: Mirror 'latest' to legacy namespace
        if: ${{ inputs.fake_release_tag != '' }}
        run: docker buildx imagetools create -t ${{ env.NS_B }}:latest ${{ env.NS_A }}:latest

      # The actual assertion: same content in both namespaces.
      - name: Verify digests match
        run: |
          A=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ${{ env.NS_A }}:snapshot-${{ github.sha }})
          B=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ${{ env.NS_B }}:snapshot-${{ github.sha }})
          echo "A: $A"
          echo "B: $B"
          test "$A" = "$B" && echo "OK - digests identical" || { echo "MISMATCH"; exit 1; }

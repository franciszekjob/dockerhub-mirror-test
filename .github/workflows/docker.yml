# Dry run of software-mansion/pathfinder .github/workflows/docker.yml, kept as close
# to the original as possible. Only these things differ:
#   - franciszekjob/mirror-test stands in for swmansion/pathfinder (namespace A)
#   - fjobswm/mirror-test stands in for eqlabs/pathfinder (legacy namespace B)
#   - LEGACY_DOCKER_HUB_* secrets stand in for EQLABS_DOCKER_HUB_*
#   - runs-on: ubuntu-latest instead of the self-hosted pathfinder-large-ubuntu
#   - FAKE_VERSION build arg instead of PATHFINDER_FORCE_VERSION (alpine, not Rust)
#   - update-infra echoes instead of dispatching a workflow on a private infra repo
# Everything else - trigger set, job split, if-conditions, step order, logins - is verbatim.

# Builds and uploads docker images whenever a version tag is pushed. When a release is created,
# the associated image is then tagged with the version number and latest.

name: Docker

on:
  workflow_dispatch:
    inputs:
      pathfinder_force_version:
        description: 'Set version for pathfinder via PATHFINDER_FORCE_VERSION (defaults to `git describe --tags --dirty`)'
        type: string
        default: ''
  push:
    tags:
      - 'v*'
  release:
    types: [published]

env:
  # Workaround for https://github.com/rust-lang/cargo/issues/8719#issuecomment-1516492970
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Build a docker image unless this was triggered by a release.
  build-image:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: franciszekjob/mirror-test
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate version
        id: generate_version
        env:
          PATHFINDER_FORCE_VERSION: ${{ inputs.pathfinder_force_version }}
        run: |
          if [ -n "$PATHFINDER_FORCE_VERSION" ]; then
            echo "pathfinder_version=$PATHFINDER_FORCE_VERSION" >> $GITHUB_OUTPUT
          else
            echo -n "pathfinder_version=" >> $GITHUB_OUTPUT
            git describe --tags --dirty >> $GITHUB_OUTPUT
          fi
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      # Required for git security reasons. See https://github.com/rustyhorde/vergen/pull/126#issuecomment-1201088162
      - name: Vergen git safe directory
        run: git config --global --add safe.directory /workspace
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          file: ./Dockerfile
          build-args: |
            FAKE_VERSION=${{ steps.generate_version.outputs.pathfinder_version }}
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: franciszekjob/mirror-test:snapshot-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Transitional: mirror the image to the legacy fjobswm/mirror-test repository so
      # that users who have not switched namespaces yet keep receiving updates.
      # Docker Hub allows only one logged-in account per registry, so we log in again
      # as the legacy account and copy the already-pushed image instead of pushing twice.
      # Remove this block and the LEGACY_* secrets once the migration window closes.
      - name: Login to Docker Hub (legacy namespace)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LEGACY_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKER_HUB_ACCESS_TOKEN }}
      - name: Mirror snapshot to fjobswm/mirror-test
        run: docker buildx imagetools create -t fjobswm/mirror-test:snapshot-${{ github.sha }} franciszekjob/mirror-test:snapshot-${{ github.sha }}

  # Add the release labels to the associated docker image.
  tag-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Tag image with release name
        run: docker buildx imagetools create -t franciszekjob/mirror-test:${{ github.event.release.tag_name }} franciszekjob/mirror-test:snapshot-${{ github.sha }}
        # Only tag the image as 'latest' if its a release i.e. not a prerelease.
      - name: Tag image with 'latest'
        if: ${{ !github.event.release.prerelease }}
        run: docker buildx imagetools create -t franciszekjob/mirror-test:latest franciszekjob/mirror-test:snapshot-${{ github.sha }}
      # Transitional: mirror the image to the legacy fjobswm/mirror-test repository so
      # that users who have not switched namespaces yet keep receiving updates.
      # Docker Hub allows only one logged-in account per registry, so we log in again
      # as the legacy account and copy the already-pushed image instead of pushing twice.
      # Remove this block and the LEGACY_* secrets once the migration window closes.
      - name: Login to Docker Hub (legacy namespace)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LEGACY_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKER_HUB_ACCESS_TOKEN }}
      - name: Mirror release tag to fjobswm/mirror-test
        run: docker buildx imagetools create -t fjobswm/mirror-test:${{ github.event.release.tag_name }} franciszekjob/mirror-test:${{ github.event.release.tag_name }}
      - name: Mirror 'latest' to fjobswm/mirror-test
        if: ${{ !github.event.release.prerelease }}
        run: docker buildx imagetools create -t fjobswm/mirror-test:latest franciszekjob/mirror-test:latest

  # Dispatch the version bump workflow on pathfinder-infra
  update-infra:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: tag-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pathfinder-infra version bump
        run: |
          echo "would dispatch update-pathfinder-version.yml with version=${{ github.event.release.tag_name }}"
